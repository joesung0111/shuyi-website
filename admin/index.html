<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="舒逸內容管理後台">
  <title>舒逸後台｜內容管理</title>
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <div id="login-view" class="login-view">
    <div class="login-card">
      <p class="eyebrow">SHU YI / PRIVATE CMS <span class="app-version">v1.0.1</span></p>
      <h1>內容後台</h1>
      <p>登入後管理文章、影片與情報。</p>
      <form id="login-form">
        <label>管理密碼<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="button button--primary" type="submit">登入後台 <span>→</span></button>
        <p class="form-error" id="login-error" role="alert"></p>
      </form>
    </div>
  </div>
  <div id="app-view" class="app-view" hidden>
    <header class="admin-header">
      <a href="/" class="admin-brand">舒逸 <span>SHU YI CMS</span></a>
      <div><a href="/" target="_blank" rel="noopener">查看網站 ↗</a><button id="logout-button" class="button button--ghost" type="button">登出</button></div>
    </header>
    <main class="admin-main">
      <div class="admin-title">
        <div><p class="eyebrow">CONTENT STUDIO</p><h1>內容管理</h1><p>集中管理公開網站的文章、影片與情報。</p></div>
        <button id="new-button" class="button button--primary" type="button">新增內容 <span>＋</span></button>
      </div>
      <div class="toolbar">
        <div class="filters" role="tablist" aria-label="內容類型"><button class="filter is-active" data-filter="all">全部</button><button class="filter" data-filter="article">文章</button><button class="filter" data-filter="video">影片</button><button class="filter" data-filter="news">情報</button></div>
        <label class="search-label"><span>搜尋</span><input id="search-input" type="search" placeholder="標題或網址代稱"></label>
      </div>
      <p id="list-error" class="form-error" role="alert"></p><div id="content-list" class="content-list"></div>
    </main>
  </div>
  <dialog id="editor-dialog">
    <form id="editor-form" method="dialog">
      <div class="dialog-heading"><div><p class="eyebrow" id="editor-kicker">NEW CONTENT</p><h2 id="editor-title">新增內容</h2></div><button class="close-button" value="cancel" aria-label="關閉">×</button></div>
      <input type="hidden" name="id">
      <div class="form-grid">
        <label>內容類型<select name="type" required><option value="article">文章</option><option value="video">影片</option><option value="news">情報</option></select></label>
        <fieldset class="status-field"><legend>狀態</legend><div class="status-tabs" role="tablist" aria-label="發布狀態"><button type="button" class="status-tab is-active" data-status="draft" role="tab" aria-selected="true">草稿</button><button type="button" class="status-tab" data-status="published" role="tab" aria-selected="false">發布</button></div><input type="hidden" name="status" value="draft"></fieldset>
        <label class="full">標題<input name="title" required maxlength="120"></label>
        <label class="full">網址代稱（slug）<input name="slug" required pattern="[a-z0-9-]+" placeholder="例如 first-breath"><small>只能使用小寫英文、數字與連字號。</small></label>
        <label class="full">摘要<textarea name="excerpt" rows="2" maxlength="240"></textarea></label>
        <label class="full">內文<textarea name="body" rows="8"></textarea></label>
        <label class="full">影片網址（影片內容才需要）<input name="video_url" placeholder="/素材/單純動畫-02.mp4 或 YouTube 網址"><small>可填 MP4 檔案網址，或 YouTube 分享連結（youtube.com、youtu.be）。</small></label>
        <label class="full">封面網址（選填）<input name="cover_url" placeholder="/素材/圖片檔名.jpg 或 https://..."><small>前台縮圖會優先使用這張封面；未填時才使用內容類型的預設視覺。</small></label>
      </div>
      <p id="editor-error" class="form-error" role="alert"></p>
      <div class="dialog-actions"><button class="button button--ghost" value="cancel">取消</button><button id="save-button" class="button button--primary" value="default">儲存內容 <span>→</span></button></div>
    </form>
  </dialog>
  <script src="/admin/admin.js"></script>
</body>
</html>
